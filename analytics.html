<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KYŪREIKA · Аналитика</title><style>
*{box-sizing:border-box}body{margin:0;background:#101116;color:#eee;font:15px system-ui}nav{display:flex;gap:20px;padding:18px 24px;border-bottom:1px solid #61503b;align-items:center}nav strong{margin-right:auto;color:#e8c88f}a{color:#e8c88f;text-decoration:none}main{max-width:1200px;margin:auto;padding:24px}h1,h2{color:#e8c88f}h1{font-size:28px}h2{font-size:19px}.muted{color:#aaa}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.panel,.metric{background:#191a20;border:1px solid #40372d;border-radius:14px;padding:18px}.metric strong{display:block;font-size:28px;color:#e8c88f;margin-top:8px}.panel{margin-top:20px}select{background:#24252c;color:#eee;padding:8px;border:1px solid #61503b;border-radius:6px}svg{width:100%;height:220px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 6px;border-bottom:1px solid #333;overflow-wrap:anywhere}.ok{color:#76d5a0}.failed{color:#ff9388}.skipped{color:#e8c88f}@media(max-width:550px){main{padding:12px}td,th{font-size:12px}}
</style></head><body><nav><strong>KYŪREIKA</strong><a href="/">Главная</a><a href="/analytics" aria-current="page">Аналитика</a></nav><main><h1>Интеллект и развитие</h1><p id="connection" role="status">Подключение…</p><div class="cards" id="cards"></div><section class="panel"><h2>Динамика показателей</h2><label>Показатель <select id="metric"></select></label><label>Период <select id="period"><option value="3600000">Час</option><option value="86400000">Сутки</option><option value="604800000" selected>Неделя</option></select></label><svg id="chart" viewBox="0 0 600 220" role="img" aria-label="График наблюдений"></svg><p id="note" class="muted">Сохранённые наблюдения фонового ядра и текущие данные. Обновление каждые 5 секунд.</p></section><section class="panel"><h2>Состояние подсистем</h2><p class="muted">Последний зарегистрированный результат, не признак выполнения прямо сейчас.</p><table><thead><tr><th>Модуль</th><th>Статус</th><th>Ошибки</th><th>Обновление</th></tr></thead><tbody id="stages"></tbody></table></section></main><script>
const names={words:'Слова в истории',definitions:'Определения',memories:'Воспоминания',facts:'Текущие факты',messages:'Сообщения',research:'Цели исследований'};
const $=id=>document.getElementById(id), history=[];
for(const [key,label] of Object.entries(names)){const o=document.createElement('option');o.value=key;o.textContent=label;$('metric').append(o)}
function el(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
function svg(tag,attrs,text){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function draw(){const chart=$('chart');chart.replaceChildren();const key=$('metric').value;const data=history.map(r=>({t:Date.parse(r.time),v:r.metrics[key]})).filter(r=>Number.isFinite(r.v)&&Number.isFinite(r.t)&&r.t>=Date.now()-Number($('period').value));if(!data.length){chart.append(svg('text',{x:20,y:100,fill:'#aaa'},'Нет наблюдений'));return}const min=Math.min(...data.map(r=>r.v)),max=Math.max(min+1,...data.map(r=>r.v)),start=data[0].t,end=Math.max(start+1,data.at(-1).t);const x=r=>55+530*(r.t-start)/(end-start),y=r=>185-165*(r.v-min)/(max-min);for(let i=0;i<=4;i++){const yy=20+i*41.25;chart.append(svg('line',{x1:55,x2:585,y1:yy,y2:yy,stroke:'#39333a'}),svg('text',{x:48,y:yy+4,'text-anchor':'end',fill:'#aaa','font-size':11},(max-(max-min)*i/4).toFixed(1)))}chart.append(svg('polyline',{points:data.map(r=>x(r)+','+y(r)).join(' '),fill:'none',stroke:'#e8c88f','stroke-width':2}));for(const r of data){const dot=svg('circle',{cx:x(r),cy:y(r),r:3,fill:'#e8c88f'});dot.append(svg('title',{},new Date(r.t).toLocaleTimeString()+' · '+r.v));chart.append(dot)}chart.append(svg('text',{x:55,y:210,fill:'#aaa','font-size':11},new Date(start).toLocaleTimeString()),svg('text',{x:585,y:210,fill:'#aaa','font-size':11,'text-anchor':'end'},new Date(data.at(-1).t).toLocaleTimeString()))}
$('metric').onchange=draw;$('period').onchange=draw;
async function refresh(){try{const r=await fetch('/api/statistics',{headers:{'X-Session-Token':document.querySelector('meta[name="session-token"]').content},signal:AbortSignal.timeout(8000)});if(!r.ok)throw Error();const d=await r.json();history.push(d);if(history.length>12000)history.shift();$('connection').textContent='● Онлайн · '+new Date(d.time).toLocaleTimeString();$('connection').className='ok';$('cards').replaceChildren(...Object.entries(names).map(([k,label])=>{const box=el('div','','metric');box.append(el('span',label),el('strong',d.metrics[k]??'—'));return box}));$('stages').replaceChildren(...d.stages.map(s=>{const row=el('tr','');row.append(el('td',s.module),el('td',({ok:'Успешно',failed:'Ошибка',skipped:'Пропущен',unobserved:'Нет данных'})[s.status]||s.status,s.status),el('td',s.failures??'—'),el('td',s.updated?new Date(s.updated).toLocaleString():'—'));return row}));draw()}catch{$('connection').textContent='Нет связи · показаны последние полученные данные';$('connection').className='failed'}finally{setTimeout(refresh,5000)}}async function start(){try{const r=await fetch("/api/statistics/history",{headers:{"X-Session-Token":document.querySelector('meta[name="session-token"]').content},signal:AbortSignal.timeout(8000)});if(r.ok)history.push(...(await r.json()).history)}catch{}refresh()}start();
</script></body></html>
